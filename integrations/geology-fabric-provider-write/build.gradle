plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../geology-bridge/src']
            include 'com/orbital/geoworld/geology/KarstogenesisFabricProviderWrite.java'
            include 'com/orbital/geoworld/geology/ProviderWriteState.java'
            include 'com/orbital/geoworld/geology/mixin/ChunkGeneratorProviderWriteMixin.java'
            include 'com/orbital/geoworld/geology/mixin/NoiseChunkGeneratorProviderWriteMixin.java'
            include 'com/orbital/geoworld/geology/karst-delta-chunk-reader.java'
            include 'com/orbital/geoworld/geology/karst-host-arbitration.java'
        }
    }
}

loom {
    runs {
        server {
            server()
            runDir project.findProperty('geoworldRunDir') ?: 'run'
            vmArg "-Dgeoworld.write219.package=${project.findProperty('geoworldPackageRoot') ?: ''}"
            vmArg "-Dgeoworld.write219.receipt=${project.findProperty('geoworldReceiptPath') ?: ''}"
            vmArg "-Dgeoworld.write219.register=${project.findProperty('geoworldRegisterPath') ?: ''}"
            vmArg "-Dgeoworld.write219.repair=${project.findProperty('geoworldRepairPath') ?: ''}"
            vmArg "-Dgeoworld.write219.binding=${project.findProperty('geoworldBindingPath') ?: ''}"
            vmArg "-Dgeoworld.write219.bindingSha256=${project.findProperty('geoworldBindingSha256') ?: ''}"
            vmArg "-Dgeoworld.write219.primaryMod=${project.findProperty('geoworldPrimaryMod') ?: ''}"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
}
