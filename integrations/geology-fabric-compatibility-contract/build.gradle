plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            include 'com/orbital/geoworld/geology/KarstogenesisFabricCompatibilityContract.java'
            include 'com/orbital/geoworld/geology/KarstCompatibilityContract.java'
            include 'com/orbital/geoworld/geology/CompatibilityContractHarness.java'
            include 'com/orbital/geoworld/geology/CompatibilityAuditState.java'
        }
    }
}

loom {
    runs {
        server {
            server()
            runDir project.findProperty('geoworldRunDir') ?: 'run'
            vmArg "-Dgeoworld.compat211.target=${project.findProperty('geoworldTargetPath') ?: ''}"
            vmArg "-Dgeoworld.compat211.targetSha256=${project.findProperty('geoworldTargetSha256') ?: ''}"
            vmArg "-Dgeoworld.compat211.receipt=${project.findProperty('geoworldReceiptPath') ?: ''}"
            vmArg "-Dgeoworld.compat211.register=${project.findProperty('geoworldRegisterPath') ?: ''}"
        }
    }
}

tasks.register('fixtureJar', Jar) {
    archiveBaseName = 'karstogenesis-compat-fixture'
    archiveVersion = project.mod_version
    destinationDirectory = layout.buildDirectory.dir('fixture-libs')
    from file('../geology-fabric-compatibility-fixture/src/main/resources')
}

tasks.register('contractAudit', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.orbital.geoworld.geology.CompatibilityContractHarness'
    args project.findProperty('geoworldContractReport') ?: ''
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
}
