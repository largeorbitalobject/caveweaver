plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../geology-bridge/src']
            include 'com/orbital/geoworld/geology/KarstogenesisFabricMultichunkSelector.java'
            include 'com/orbital/geoworld/geology/MultichunkSelectorState.java'
            include 'com/orbital/geoworld/geology/mixin/NoiseChunkGeneratorMultichunkSelectorMixin.java'
            include 'com/orbital/geoworld/geology/karst-delta-chunk-reader.java'
            include 'com/orbital/geoworld/geology/karst-host-arbitration.java'
        }
    }
}

loom {
    runs {
        server {
            server()
            runDir project.findProperty('geoworldRunDir') ?: 'run'
            vmArg "-Dgeoworld.selector206.package=${project.findProperty('geoworldPackageRoot') ?: ''}"
            vmArg "-Dgeoworld.selector206.receipt=${project.findProperty('geoworldReceiptPath') ?: ''}"
            vmArg "-Dgeoworld.selector206.register=${project.findProperty('geoworldRegisterPath') ?: ''}"
            vmArg "-Dgeoworld.selector206.candidate=${project.findProperty('geoworldCandidateId') ?: ''}"
            vmArg "-Dgeoworld.selector206.translationX=${project.findProperty('geoworldTranslationX') ?: ''}"
            vmArg "-Dgeoworld.selector206.translationY=${project.findProperty('geoworldTranslationY') ?: ''}"
            vmArg "-Dgeoworld.selector206.translationZ=${project.findProperty('geoworldTranslationZ') ?: ''}"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
}
